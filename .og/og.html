<!doctype html><html><head><meta charset="utf-8">
<!-- Render: headless Chrome at 1200x630 (og-image / og-docs, ?docs for the docs variant) or 1280x640 (social preview).
     Same structure as the landing page: Fig. 1 fills the plate, caption below it (no display headline). -->
<style>
@font-face{font-family:"Anybody";src:url(../site/fonts/anybody-wdth.woff2) format("woff2");font-weight:100 900;font-stretch:50% 150%}
@font-face{font-family:"AH";src:url(../site/fonts/atkinson-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"AH";src:url(../site/fonts/atkinson-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"AHM";src:url(../site/fonts/atkinson-mono-400.woff2) format("woff2")}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#0b0b0c;color:#e6e4dd}
svg text{font-family:"AHM",monospace;fill:#e6e4dd}
.ray,.spoke,.ring{fill:none}.fig .spoke{stroke-width:1.6}.fig .ray{stroke-width:1.5}
.top{position:absolute;left:48px;right:48px;top:30px;height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #6b6b70;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:14px;font:650 38px/1 "Anybody";font-stretch:72%;letter-spacing:.02em}
.brand img{width:42px;height:42px}
.tag{font:400 17px/1 "AHM";color:rgba(230,228,221,.72);letter-spacing:.04em}
.fig{position:absolute;left:40px;right:40px;top:104px;bottom:150px}
.fig svg{width:100%;height:100%;overflow:visible}
.cap{position:absolute;left:48px;right:48px;bottom:34px;border-top:1px solid #6b6b70;padding-top:20px}
.cap h1{margin:0 0 8px;font:700 32px/1.2 "AH"}
.fn{font:800 32px/1 "Anybody";font-stretch:52%;letter-spacing:.14em;color:rgba(230,228,221,.72)}
.dash{color:#6b6b70}
.cap p{margin:0;font:400 20px/1.35 "AH";color:rgba(230,228,221,.72)}
</style></head><body>
<div class="top"><div class="brand"><img src="../site/favicon.svg" alt="">certfan</div><div class="tag" id="tag">blackman99.github.io/certfan</div></div>
<div class="fig" id="fig"></div>
<div class="cap"><h1><span class="fn">FIG. 1</span> <span class="dash">—</span> Did every node get the renewed certificate?</h1>
<p>One hostname, four addresses, one SHA-256 glyph per node. Three match; one is out of line.</p></div>
<script src="../site/app.js"></script>
<script>
const box = document.getElementById("fig");
certfanFan(box, 0, 2, { W: Math.max(1000, Math.round(560 * box.clientWidth / box.clientHeight)) });
if (location.search.includes("docs")) document.getElementById("tag").textContent = "certfan docs";
</script>
</body></html>
