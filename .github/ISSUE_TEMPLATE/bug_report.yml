name: Bug report
description: certfan crashed, or reported the wrong verdict for a host
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: certfan version
      placeholder: "certfan --version"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: "certfan check example.com --format json"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / error
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: dropdown
    id: kind
    attributes:
      label: What kind of target?
      options: ["Single server", "Load balancer / multiple A records", "CDN / anycast", "Kubernetes ingress", "Other"]
