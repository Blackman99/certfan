site_name: certfan docs
site_description: Probe every IP behind a TLS hostname and catch the node still serving an old, expiring or broken certificate.
site_url: https://blackman99.github.io/certfan/docs/
repo_url: https://github.com/Blackman99/certfan
repo_name: Blackman99/certfan
edit_uri: edit/main/docs/
copyright: MIT © 2026 Blackman99
theme:
  name: material
  custom_dir: overrides
  favicon: assets/logo.svg
  logo: assets/logo.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features: [navigation.instant, navigation.top, content.code.copy, search.highlight, toc.follow]
extra_css: [stylesheets/plate.css]
nav:
  - Overview: index.md
  - Install: install.md
  - Usage: usage.md
  - Monitoring (cron, Prometheus, CI): monitoring.md
  - Command reference: reference.md
  - FAQ: faq.md
  - Blog:
    - All posts: blog/index.md
    - "Your cert renewed. Did every node get it?": blog/every-node-same-cert.md
    - "证书续期了，每台节点都换上了吗？": blog/every-node-same-cert-zh.md
  - Home page ↗: https://blackman99.github.io/certfan/
markdown_extensions: [admonition, attr_list, tables, {toc: {permalink: true}}, pymdownx.highlight, pymdownx.superfences]
